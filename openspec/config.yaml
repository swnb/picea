schema: spec-driven

context: |
  Picea 是 Rust workspace，包含 core physics crate、picea-lab Rust 工具链、
  React/Vite workbench 和独立 proc-macro crate。当前事实、验证输出与
  docs/plans/2026-04-25-picea-physics-engine-production-milestones.md 的现行边界
  优先于历史计划快照；模块路由见 docs/ai/repo-map.md 与 docs/ai/index.md。
  每个 change 的任务 checkbox 与完成进度只以该 change 的 tasks.md 为准。
  所有本地 Cargo/Git/Rust/npm 验证使用 rtk proxy；实现先建立可证伪的行为锁，
  再做最小修改，并保留失败证据、未运行项和残余风险。

rules:
  proposal:
    - 区分已验证事实、推断和未知项
    - 明确 public API、physics behavior、schema 与发布操作边界
  tasks:
    - 保持规划、行为锁、实现、targeted verification、broader verification、review、closeout 的顺序
    - 每个实现节点包含明确 scope、成功标准、验证与证据更新
  specs:
    - 只写耐久的可观察行为，不复制易过期的历史 receipt 或任务进度
  design:
    - 明确事实来源、失败策略、回滚边界以及不采用方案
