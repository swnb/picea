name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: Fast validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/picea-lab/web/package-lock.json
          package-manager-cache: true
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Run fast profile
        run: bash scripts/ci/run.sh fast

  full:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/picea-lab/web/package-lock.json
          package-manager-cache: true
      - name: Install stable Rust
        run: |
          # trybuild snapshots include standard-library diagnostic excerpts.
          rustup toolchain install stable --profile minimal --component clippy --component rust-src
          rustup default stable
      - name: Install dev-server contract prerequisites
        run: |
          cargo install just --locked --version 1.45.0
          just --version
      - name: Run full profile
        run: bash scripts/ci/run.sh full
