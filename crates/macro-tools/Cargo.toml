[package]
name = "picea-macro-tools"
version = "0.1.0"
edition = "2021"
authors = ["swnb", "async-rustacean"]
license-file = "LICENSE"
repository = "https://github.com/swnb/picea"
homepage = "https://github.com/swnb/picea"
documentation = "https://docs.rs/picea-macro-tools"
categories = ["development-tools::procedural-macro-helpers"]
keywords = ["derive", "macros", "proc-macro"]
description = """
standalone derive helpers for named-field Rust structs
"""
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
quote = "1.0.35"
syn = { version = "2.0.55", features = ["full"] }

[dev-dependencies]
trybuild = "1.0.96"

[lib]
proc-macro = true
